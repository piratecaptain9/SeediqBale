<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>活動報到系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            mono: ['"DM Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --ink:        #080b10;
      --deep:       #0d1119;
      --panel:      #131926;
      --card:       #1a2235;
      --border:     #243044;
      --border2:    #2e3d55;
      --muted:      #4a5e7a;
      --soft:       #7a92b4;
      --light:      #c0d0e8;
      --white:      #e8eef8;
      --gold:       #e8c96a;
      --gold-dim:   rgba(232,201,106,0.10);
      --gold-ring:  rgba(232,201,106,0.35);
      --lime:       #7ddb8c;
      --lime-dim:   rgba(125,219,140,0.10);
      --rose:       #f07070;
      --rose-dim:   rgba(240,112,112,0.10);
      --amber:      #f0b060;
      --amber-dim:  rgba(240,176,96,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      background: var(--ink);
      font-family: 'Noto Sans TC', sans-serif;
      color: var(--light);
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .ambient-guest {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,201,106,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 40% 35% at 10% 90%, rgba(232,201,106,0.04) 0%, transparent 55%);
    }
    .ambient-staff {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(125,219,140,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 40% 35% at 90% 90%, rgba(96,168,224,0.04) 0%, transparent 55%);
    }

    .divider-gold { height:1px; background:linear-gradient(90deg,transparent,var(--gold-ring),transparent); }
    .divider-lime { height:1px; background:linear-gradient(90deg,transparent,rgba(125,219,140,0.35),transparent); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .blink { animation: blink 2s ease-in-out infinite; }

    @keyframes rise {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .rise { animation: rise 0.4s cubic-bezier(0.34,1.5,0.64,1) both; }

    /* Scanner overrides */
    #qr-reader { width:100%!important; }
    #qr-reader video { width:100%!important; height:100%!important; object-fit:cover!important; }
    #qr-reader__scan_region { width:100%!important; height:100%!important; }
    #qr-reader__scan_region img,
    #qr-reader__dashboard,
    #qr-reader__header_message { display:none!important; }

    /* Scan brackets */
    .brk { position:absolute; width:32px; height:32px; border-color:var(--lime); border-style:solid; border-width:0; }
    .brk-tl { top:13%; left:13%; border-top-width:2px; border-left-width:2px; border-radius:3px 0 0 0; }
    .brk-tr { top:13%; right:13%; border-top-width:2px; border-right-width:2px; border-radius:0 3px 0 0; }
    .brk-bl { bottom:13%; left:13%; border-bottom-width:2px; border-left-width:2px; border-radius:0 0 0 3px; }
    .brk-br { bottom:13%; right:13%; border-bottom-width:2px; border-right-width:2px; border-radius:0 0 3px 0; }

    @keyframes laser { 0%{top:13%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:87%;opacity:0} }
    .laser {
      position:absolute; left:13%; right:13%; height:1.5px;
      background:linear-gradient(90deg,transparent,var(--lime),transparent);
      box-shadow:0 0 6px rgba(125,219,140,0.5);
      animation:laser 2.4s ease-in-out infinite;
    }
    .vignette {
      position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 60% 60% at 50% 50%, transparent 35%, rgba(8,11,16,0.75) 100%);
    }

    @keyframes spin { to{transform:rotate(360deg)} }
    .spinner {
      width:28px; height:28px; border-radius:50%;
      border:2px solid var(--border2); border-top-color:var(--lime);
      animation:spin 0.75s linear infinite;
    }

    @keyframes shimmer {
      0%   { box-shadow:0 0 0 0 var(--gold-ring); }
      70%  { box-shadow:0 0 0 14px rgba(232,201,106,0); }
      100% { box-shadow:0 0 0 0 rgba(232,201,106,0); }
    }
    .shimmer { animation:shimmer 1.4s ease-out 2; }

    input[type="text"], input[type="password"] {
      background: var(--card);
      border: 1px solid var(--border2);
      color: var(--white);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-family: 'Noto Sans TC', sans-serif;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--gold); }
    input.staff-input:focus { border-color: var(--lime); }
    input::placeholder { color: var(--muted); }

    .btn-gold {
      background: var(--gold); color: #1a1400;
      border: none; border-radius: 12px; padding: 13px 24px;
      font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: all 0.18s; width: 100%;
    }
    .btn-gold:hover { background: #f0d880; }
    .btn-gold:active { transform: scale(0.97); }
    .btn-gold:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

    .btn-lime {
      background: var(--lime); color: #061208;
      border: none; border-radius: 12px; padding: 11px 20px;
      font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-lime:hover { background: #9aeaa7; }
    .btn-lime:active { transform:scale(0.97); }
    .btn-lime:disabled { opacity:0.4; cursor:not-allowed; }

    .btn-ghost {
      background: var(--card); color: var(--soft);
      border: 1px solid var(--border2); border-radius: 12px; padding: 11px 22px;
      font-family: 'Noto Sans TC', sans-serif; font-weight: 500; font-size: 14px;
      cursor: pointer; transition: all 0.18s; width: 100%;
    }
    .btn-ghost:hover { background:var(--border); color:var(--light); }
    .btn-ghost:active { transform:scale(0.97); }

    .page {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 16px 96px;
    }

    /* Bottom mode nav */
    .mode-nav {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px;
      background: rgba(13,17,25,0.88); backdrop-filter: blur(14px);
      border: 1px solid var(--border2); border-radius: 100px; padding: 5px;
      z-index: 200;
    }
    .mode-pill {
      padding: 8px 20px; border-radius: 100px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: none; transition: all 0.22s;
      background: transparent; color: var(--muted);
      font-family: 'Noto Sans TC', sans-serif; white-space: nowrap;
    }
    .mode-pill.active-guest {
      background: var(--gold-dim); color: var(--gold);
      border: 1px solid var(--gold-ring);
    }
    .mode-pill.active-staff {
      background: var(--lime-dim); color: var(--lime);
      border: 1px solid rgba(125,219,140,0.3);
    }
  </style>
</head>
<body>


<!-- ═══════════════════════════════════
     GUEST PAGE
═══════════════════════════════════ -->
<div id="page-guest" class="page ambient-guest" style="display:none">
  <div class="w-full max-w-sm flex flex-col gap-6">

    <header class="text-center pt-2 space-y-3">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 18px;
                  border-radius:100px;background:var(--gold-dim);border:1px solid var(--gold-ring)">
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.12em">
          貴賓查詢
        </span>
      </div>
      <h1 style="font-size:30px;font-weight:900;color:var(--white);line-height:1.2;letter-spacing:-.02em">
        查詢您的<br><span style="color:var(--gold)">入場 QR Code</span>
      </h1>
      <p style="font-size:13px;color:var(--soft);line-height:1.7">
        輸入姓名即可取得您的專屬邀請碼
      </p>
    </header>

    <div class="divider-gold"></div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="position:relative">
        <input type="text" id="guest-name-input" placeholder="輸入姓名，例：王小明"
               oninput="guestInputChange()"
               onkeydown="if(event.key==='Enter')searchGuest()"/>
        <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
                     color:var(--muted);font-size:16px;pointer-events:none">🔍</span>
      </div>
      <button class="btn-gold" id="guest-btn" onclick="searchGuest()">查詢 QR Code</button>
    </div>

    <div id="guest-result" class="hidden"></div>
    <div id="guest-list"   class="hidden" style="display:none;flex-direction:column;gap:10px"></div>

    <p style="text-align:center;font-size:11px;color:var(--muted)">
      若查無資料，請洽現場工作人員
    </p>
  </div>
</div>


<!-- ═══════════════════════════════════
     STAFF PAGE
═══════════════════════════════════ -->
<div id="page-staff" class="page ambient-staff" style="display:none">
  <div class="w-full max-w-sm flex flex-col gap-5">

    <!-- ── Password Gate ── -->
    <div id="staff-gate" style="min-height:70dvh;display:flex;flex-direction:column;
                                align-items:center;justify-content:center;gap:24px">
      <div style="text-align:center">
        <div style="font-size:44px;margin-bottom:10px">🔐</div>
        <h2 style="font-size:22px;font-weight:900;color:var(--white)">工作人員入口</h2>
        <p style="font-size:13px;color:var(--soft);margin-top:6px">請輸入工作人員密碼</p>
      </div>
      <div style="width:100%;display:flex;flex-direction:column;gap:10px">
        <input type="password" id="staff-pw" class="staff-input" placeholder="••••••"
               onkeydown="if(event.key==='Enter')checkPW()"/>
        <button class="btn-lime" onclick="checkPW()" style="width:100%;padding:13px">進入掃碼系統</button>
        <p id="pw-err" style="display:none;text-align:center;font-size:12px;color:var(--rose)">
          密碼錯誤，請再試一次
        </p>
      </div>
    </div>

    <!-- ── Scanner (shown after auth) ── -->
    <div id="staff-scanner" style="display:none;flex-direction:column;gap:18px">

      <header style="text-align:center;padding-top:8px">
        <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 18px;
                    border-radius:100px;background:var(--lime-dim);
                    border:1px solid rgba(125,219,140,0.3);margin-bottom:12px">
          <span style="width:7px;height:7px;border-radius:50%;background:var(--lime)" class="blink"></span>
          <span style="font-family:'DM Mono',monospace;font-size:11px;
                       color:var(--lime);letter-spacing:.12em">STAFF · LIVE</span>
        </div>
        <h1 style="font-size:24px;font-weight:900;color:var(--white);letter-spacing:-.02em">
          掃描貴賓 QR Code
        </h1>
      </header>

      <!-- Camera card -->
      <div id="staff-card" style="border-radius:20px;overflow:hidden;
                                  border:1px solid var(--border);background:var(--panel)">
        <div style="position:relative;width:100%;aspect-ratio:1">
          <div id="qr-reader" style="position:absolute;inset:0"></div>
          <div class="vignette"></div>
          <div id="brackets" style="display:none">
            <div class="brk brk-tl"></div><div class="brk brk-tr"></div>
            <div class="brk brk-bl"></div><div class="brk brk-br"></div>
            <div class="laser"></div>
          </div>
          <div id="staff-idle" style="position:absolute;inset:0;display:flex;flex-direction:column;
                                      align-items:center;justify-content:center;gap:12px;
                                      background:var(--card)">
            <div style="font-size:48px;opacity:.25">📷</div>
            <p style="font-size:13px;color:var(--muted)">相機尚未啟動</p>
          </div>
          <div id="staff-loading" style="display:none;position:absolute;inset:0;
                                        flex-direction:column;align-items:center;
                                        justify-content:center;gap:12px;z-index:20;
                                        background:rgba(8,11,16,0.82);backdrop-filter:blur(4px)">
            <div class="spinner"></div>
            <p style="font-size:13px;color:var(--soft)">驗證報到資訊…</p>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;
                    border-top:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <p id="s-title" style="font-size:14px;font-weight:700;color:var(--white);
                                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              尚未啟動
            </p>
            <p id="s-sub" style="font-size:12px;color:var(--muted);margin-top:3px;
                                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              點擊右側按鈕開始掃描
            </p>
          </div>
          <button class="btn-lime" id="toggle-btn" onclick="staffToggle()">開始掃描</button>
        </div>
      </div>

      <div id="staff-result" style="display:none"></div>

      <div id="cam-err" style="display:none;border-radius:16px;
                               border:1px solid rgba(240,112,112,0.25);
                               background:var(--rose-dim);padding:18px 20px">
        <p style="font-weight:700;font-size:14px;color:var(--rose)">⚠ 無法存取相機</p>
        <p style="font-size:12px;color:var(--soft);margin-top:6px;line-height:1.6">
          請確認已授予相機權限，或裝置相機未被其他程式佔用後重新整理。
        </p>
        <button onclick="location.reload()" class="btn-ghost"
                style="margin-top:12px;width:auto;padding:8px 16px;font-size:12px">
          重新整理頁面
        </button>
      </div>

    </div>
  </div>
</div>


<!-- ═══════════════════════════════════
     MODE NAV
═══════════════════════════════════ -->
<nav class="mode-nav">
  <button class="mode-pill" id="nav-guest" onclick="setMode('guest')">🎟 貴賓查詢</button>
  <button class="mode-pill" id="nav-staff" onclick="setMode('staff')">📷 工作人員</button>
</nav>


<!-- ═══════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════ -->
<script>
// ╔═══════════════════════════════════════════════════════╗
// ║  ★ 請填入以下三個設定                                  ║
// ╚═══════════════════════════════════════════════════════╝
const GAS_URL        = 'https://script.google.com/macros/s/AKfycbzzmPJ3lmKfQuQEjfpLpOqpZUuCU7NBqhIUBThdPYWRGQdsEU7fXZVJaAP_zrjuz_mdhQ/exec';
const CHECKIN_BASE   = ' https://piratecaptain9.github.io/SeediqBale/';  // 不含 ?id=
const STAFF_PASSWORD = 'staff2025';                     // 工作人員密碼


// ══════════════════════════════════════
// ROUTING
// ══════════════════════════════════════
function getMode() {
  return new URLSearchParams(location.search).get('mode') || 'guest';
}
function setMode(mode) {
  const u = new URL(location.href);
  u.searchParams.set('mode', mode);
  history.pushState({}, '', u);
  renderMode(mode);
}
function renderMode(mode) {
  document.getElementById('page-guest').style.display = mode === 'guest' ? 'flex' : 'none';
  document.getElementById('page-staff').style.display = mode === 'staff' ? 'flex' : 'none';
  document.getElementById('nav-guest').className = 'mode-pill' + (mode==='guest' ? ' active-guest' : '');
  document.getElementById('nav-staff').className = 'mode-pill' + (mode==='staff' ? ' active-staff' : '');
  if (mode !== 'staff') stopScanner();
}
window.addEventListener('popstate', () => renderMode(getMode()));
renderMode(getMode());


// ══════════════════════════════════════
// GUEST — Search & QR Display
// ══════════════════════════════════════
function guestInputChange() {
  hide('guest-result'); hide('guest-list');
}

async function searchGuest() {
  const name = document.getElementById('guest-name-input').value.trim();
  if (!name) return;

  const btn = document.getElementById('guest-btn');
  btn.disabled = true; btn.textContent = '查詢中…';
  hide('guest-result'); hide('guest-list');

  try {
    const res  = await apiFetch({ action: 'lookup', name });
    if (res.status === 'not_found') {
      guestError('查無此姓名', '請確認姓名正確，或洽現場工作人員');
    } else if (res.status === 'found_one') {
      showQR(res.guest);
    } else if (res.status === 'found_many') {
      showGuestList(res.guests);
    } else {
      guestError('系統錯誤', res.message || '請稍後再試');
    }
  } catch (_) {
    guestError('連線失敗', '請確認網路後重試');
  }
  btn.disabled = false; btn.textContent = '查詢 QR Code';
}

function guestError(t, s) {
  const el = document.getElementById('guest-result');
  el.innerHTML = `
    <div style="border-radius:16px;border:1px solid rgba(240,112,112,0.25);
                background:var(--rose-dim);padding:20px;text-align:center">
      <p style="font-weight:700;font-size:14px;color:var(--rose)">${t}</p>
      <p style="font-size:12px;color:var(--soft);margin-top:6px">${s}</p>
    </div>`;
  animateShow(el);
}

function showQR(guest) {
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&ecc=M&data=${encodeURIComponent(CHECKIN_BASE + '?id=' + guest.id)}`;
  const el = document.getElementById('guest-result');
  el.innerHTML = `
    <div style="border-radius:20px;border:1px solid var(--gold-ring);
                background:var(--panel);overflow:hidden">
      <div style="padding:28px 20px 20px;text-align:center">
        <p style="font-family:'DM Mono',monospace;font-size:11px;
                  color:var(--muted);letter-spacing:.08em;margin-bottom:6px">
          您的專屬入場碼
        </p>
        <p style="font-size:20px;font-weight:900;color:var(--gold);margin-bottom:20px">
          ${guest.name} 先生／小姐
        </p>
        <div class="shimmer" style="display:inline-block;border-radius:16px;
                    overflow:hidden;border:3px solid var(--gold);
                    padding:8px;background:#fff">
          <img src="${qrSrc}" width="228" height="228"
               style="display:block;border-radius:8px" alt="QR Code" loading="lazy"/>
        </div>
        <div style="margin-top:16px;background:var(--card);border-radius:10px;
                    padding:11px 16px;display:flex;justify-content:space-between;
                    align-items:center;border:1px solid var(--border)">
          <span style="font-size:11px;color:var(--muted)">邀請 ID</span>
          <span style="font-family:'DM Mono',monospace;font-size:13px;
                       font-weight:500;color:var(--light)">${guest.id}</span>
        </div>
      </div>
      <div class="divider-gold"></div>
      <div style="padding:12px 20px;text-align:center">
        <p style="font-size:12px;color:var(--muted)">
          請向工作人員出示此 QR Code 完成報到
        </p>
      </div>
    </div>`;
  animateShow(el);
}

function showGuestList(guests) {
  const el = document.getElementById('guest-list');
  el.innerHTML = `
    <p style="font-size:13px;color:var(--soft);text-align:center">
      找到 ${guests.length} 位同名貴賓，請選擇：
    </p>
    ${guests.map(g => `
      <button onclick='showQR(${JSON.stringify(g)})'
              style="width:100%;text-align:left;border-radius:14px;
                     border:1px solid var(--border2);background:var(--card);
                     padding:15px 18px;cursor:pointer;transition:border-color .2s;
                     display:flex;justify-content:space-between;align-items:center;
                     font-family:'Noto Sans TC',sans-serif"
              onmouseover="this.style.borderColor='var(--gold-ring)'"
              onmouseout="this.style.borderColor='var(--border2)'">
        <span style="color:var(--white);font-weight:700;font-size:15px">${g.name}</span>
        <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${g.id}</span>
      </button>`).join('')}`;
  el.style.display = 'flex';
  el.classList.remove('hidden');
  void el.offsetWidth;
  el.classList.add('rise');
}


// ══════════════════════════════════════
// STAFF — Password
// ══════════════════════════════════════
function checkPW() {
  if (document.getElementById('staff-pw').value === STAFF_PASSWORD) {
    hide('staff-gate');
    const sc = document.getElementById('staff-scanner');
    sc.style.display = 'flex';
    sc.classList.add('rise');
  } else {
    const err = document.getElementById('pw-err');
    err.style.display = 'block';
    document.getElementById('staff-pw').value = '';
    document.getElementById('staff-pw').focus();
    setTimeout(() => { err.style.display = 'none'; }, 3000);
  }
}


// ══════════════════════════════════════
// STAFF — Scanner
// ══════════════════════════════════════
let qrScanner = null, scanning = false, busy = false;

function staffToggle() { scanning ? stopScanner() : startScanner(); }

function startScanner() {
  qrScanner = new Html5Qrcode('qr-reader');
  qrScanner.start(
    { facingMode: 'environment' },
    { fps:15, qrbox:{width:220,height:220}, aspectRatio:1.0,
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE] },
    onScan, () => {}
  ).then(() => {
    scanning = true;
    hide('staff-idle'); show('brackets');
    document.getElementById('toggle-btn').textContent = '停止掃描';
    setSt('掃描中…', '請將貴賓 QR Code 對準掃描框');
  }).catch(() => {
    show('cam-err');
    document.getElementById('toggle-btn').disabled = true;
    setSt('相機錯誤', '請檢查相機權限');
  });
}

async function stopScanner() {
  if (!qrScanner || !scanning) return;
  try { await qrScanner.stop(); } catch(_) {}
  scanning = false;
  hide('brackets'); show('staff-idle');
  document.getElementById('toggle-btn').textContent = '開始掃描';
  setSt('已停止', '點擊按鈕重新掃描');
}

async function onScan(decoded) {
  if (busy) return;
  busy = true;
  await stopScanner();

  let id = null;
  try { id = new URL(decoded).searchParams.get('id'); }
  catch(_) { id = decoded.trim() || null; }

  if (!id) {
    staffResult('error', 'QR Code 無效', '找不到報到 ID', null);
    busy = false; return;
  }

  show('staff-loading');
  setSt('驗證中…', `ID：${id}`);
  document.getElementById('toggle-btn').disabled = true;

  try {
    const data = await apiFetch({ action: 'checkin', id });
    hide('staff-loading');

    if (data.status === 'success') {
      staffResult('success', data.message, `報到時間：${data.checkInTime}`, data);
    } else if (data.status === 'duplicate') {
      staffResult('warn', '您已完成報到，請勿重複掃描', `首次報到：${data.checkInTime}`, data);
    } else if (data.status === 'not_found') {
      staffResult('error', '非受邀貴賓', '此 QR Code 不在貴賓名單中', null);
    } else {
      staffResult('error', '報到失敗', data.message || '請聯繫系統管理員', null);
    }
  } catch(_) {
    hide('staff-loading');
    staffResult('error', '連線失敗', '請確認網路後重試', null);
  }
  busy = false;
}

const RS = {
  success:{ icon:'✓', bg:'var(--lime-dim)', br:'rgba(125,219,140,.3)', ic:'var(--lime)', tc:'var(--lime)' },
  warn:   { icon:'!', bg:'var(--amber-dim)',br:'rgba(240,176,96,.3)',  ic:'var(--amber)',tc:'var(--amber)' },
  error:  { icon:'✕', bg:'var(--rose-dim)', br:'rgba(240,112,112,.3)',ic:'var(--rose)', tc:'var(--rose)'  },
};

function staffResult(type, title, sub, data) {
  const s = RS[type];
  const rows = data ? `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;
                padding:12px 16px;display:flex;flex-direction:column;gap:8px;margin-top:12px">
      ${data.name ? `<div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--muted)">姓名</span>
        <span style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--white)">${data.name}</span>
      </div>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--muted)">ID</span>
        <span style="font-family:'DM Mono',monospace;font-size:13px;color:var(--light)">${data.id || '—'}</span>
      </div>
    </div>` : '';

  const el = document.getElementById('staff-result');
  el.innerHTML = `
    <div style="border-radius:20px;border:1px solid ${s.br};background:${s.bg};padding:22px 20px">
      <div style="text-align:center;margin-bottom:${data ? '4px' : '0'}">
        <div style="width:52px;height:52px;border-radius:50%;background:${s.bg};
                    border:1px solid ${s.br};display:flex;align-items:center;justify-content:center;
                    font-size:22px;font-weight:900;color:${s.ic};margin:0 auto 12px">${s.icon}</div>
        <p style="font-weight:900;font-size:17px;color:${s.tc}">${title}</p>
        <p style="font-size:12px;color:var(--soft);margin-top:5px">${sub}</p>
      </div>
      ${rows}
    </div>
    <button class="btn-ghost" onclick="resetStaff()" style="margin-top:8px">
      繼續掃下一位 →
    </button>`;
  el.style.display = 'block';
  void el.offsetWidth;
  el.classList.add('rise');
  setSt('掃描完成', '查看下方結果');
  document.getElementById('toggle-btn').disabled = false;
  document.getElementById('toggle-btn').textContent = '開始掃描';
}

function resetStaff() {
  hide('staff-result');
  startScanner();
}

function setSt(t, s) {
  document.getElementById('s-title').textContent = t;
  document.getElementById('s-sub').textContent   = s;
}


// ══════════════════════════════════════
// SHARED UTILS
// ══════════════════════════════════════
async function apiFetch(body) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function show(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.dataset.flex !== undefined ? 'flex' : 'block';
}
function hide(id) {
  const el = document.getElementById(id);
  if (el) { el.style.display = 'none'; el.classList.remove('rise'); }
}
function animateShow(el) {
  el.style.display = 'block';
  el.classList.remove('rise');
  void el.offsetWidth;
  el.classList.add('rise');
}
</script>
