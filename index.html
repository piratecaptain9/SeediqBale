<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>活動報到系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#080b10;--panel:#131926;--card:#1a2235;
      --border:#243044;--border2:#2e3d55;--muted:#4a5e7a;--soft:#7a92b4;
      --light:#c0d0e8;--white:#e8eef8;
      --gold:#e8c96a;--gold-dim:rgba(232,201,106,.10);--gold-ring:rgba(232,201,106,.35);
      --lime:#7ddb8c;--lime-dim:rgba(125,219,140,.10);--lime-ring:rgba(125,219,140,.3);
      --rose:#f07070;--rose-dim:rgba(240,112,112,.10);--rose-ring:rgba(240,112,112,.3);
      --amber:#f0b060;--amber-dim:rgba(240,176,96,.10);--amber-ring:rgba(240,176,96,.3);
      --sky:#60a8f0;--sky-dim:rgba(96,168,240,.10);--sky-ring:rgba(96,168,240,.3);
      --violet:#a07df0;--violet-dim:rgba(160,125,240,.10);--violet-ring:rgba(160,125,240,.3);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{background:var(--ink);font-family:'Noto Sans TC',sans-serif;color:var(--light);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
    .ambient-guest{background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(232,201,106,.08) 0%,transparent 65%)}
    .ambient-staff{background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(125,219,140,.07) 0%,transparent 65%)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}.blink{animation:blink 2s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.rise{animation:rise .35s cubic-bezier(.34,1.5,.64,1) both}
    @keyframes spin{to{transform:rotate(360deg)}}.spinner{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--lime);animation:spin .75s linear infinite}
    @keyframes shimmer{0%{box-shadow:0 0 0 0 var(--gold-ring)}70%{box-shadow:0 0 0 14px rgba(232,201,106,0)}100%{box-shadow:0 0 0 0 rgba(232,201,106,0)}}.shimmer{animation:shimmer 1.4s ease-out 2}
    #qr-reader{width:100%!important}
    #qr-reader video{width:100%!important;height:100%!important;object-fit:cover!important}
    #qr-reader__scan_region{width:100%!important;height:100%!important}
    #qr-reader__scan_region img,#qr-reader__dashboard,#qr-reader__header_message{display:none!important}
    .brk{position:absolute;width:32px;height:32px;border-color:var(--lime);border-style:solid;border-width:0}
    .brk-tl{top:13%;left:13%;border-top-width:2px;border-left-width:2px;border-radius:3px 0 0 0}
    .brk-tr{top:13%;right:13%;border-top-width:2px;border-right-width:2px;border-radius:0 3px 0 0}
    .brk-bl{bottom:13%;left:13%;border-bottom-width:2px;border-left-width:2px;border-radius:0 0 0 3px}
    .brk-br{bottom:13%;right:13%;border-bottom-width:2px;border-right-width:2px;border-radius:0 0 3px 0}
    @keyframes laser{0%{top:13%;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:87%;opacity:0}}
    .laser{position:absolute;left:13%;right:13%;height:1.5px;background:linear-gradient(90deg,transparent,var(--lime),transparent);box-shadow:0 0 6px rgba(125,219,140,.5);animation:laser 2.4s ease-in-out infinite}
    .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 60% at 50% 50%,transparent 35%,rgba(8,11,16,.75) 100%)}
    input[type="text"],input[type="password"]{background:var(--card);border:1px solid var(--border2);color:var(--white);border-radius:10px;padding:10px 14px;font-size:14px;font-family:'Noto Sans TC',sans-serif;width:100%;outline:none;transition:border-color .2s}
    input[type="file"]{background:var(--card);border:1px solid var(--border2);color:var(--light);border-radius:10px;padding:9px 14px;font-size:13px;font-family:'Noto Sans TC',sans-serif;width:100%;outline:none;cursor:pointer}
    select{background:var(--card);border:1px solid var(--border2);color:var(--white);border-radius:8px;padding:8px 10px;font-size:12px;font-family:'Noto Sans TC',sans-serif;outline:none;width:100%;cursor:pointer}
    input:focus{border-color:var(--gold)}input.lime-focus:focus{border-color:var(--lime)}input::placeholder{color:var(--muted)}
    .btn-gold{background:var(--gold);color:#1a1400;border:none;border-radius:10px;padding:11px 22px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .18s;width:100%}
    .btn-gold:hover{background:#f0d880}.btn-gold:active{transform:scale(.97)}.btn-gold:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .btn-lime{background:var(--lime);color:#061208;border:none;border-radius:10px;padding:9px 18px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .18s}
    .btn-lime:hover{background:#9aeaa7}.btn-lime:active{transform:scale(.97)}.btn-lime:disabled{opacity:.4;cursor:not-allowed}
    .btn-lime-xs{background:var(--lime);color:#061208;border:none;border-radius:6px;padding:4px 10px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:all .18s;white-space:nowrap}
    .btn-lime-xs:hover{background:#9aeaa7}.btn-lime-xs:active{transform:scale(.95)}.btn-lime-xs:disabled{opacity:.35;cursor:not-allowed}
    .btn-rose-xs{background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose-ring);border-radius:6px;padding:4px 10px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:all .18s;white-space:nowrap}
    .btn-rose-xs:hover{background:rgba(240,112,112,.25)}.btn-rose-xs:active{transform:scale(.95)}
    .btn-sky{background:var(--sky);color:#040e1a;border:none;border-radius:10px;padding:9px 18px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .18s}
    .btn-sky:hover{background:#88c4f4}.btn-sky:active{transform:scale(.97)}.btn-sky:disabled{opacity:.4;cursor:not-allowed}
    .btn-sky-o{background:var(--sky-dim);color:var(--sky);border:1px solid var(--sky-ring);border-radius:10px;padding:9px 18px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .18s}
    .btn-sky-o:hover{background:rgba(96,168,240,.2)}.btn-sky-o:active{transform:scale(.97)}
    .btn-ghost{background:var(--card);color:var(--soft);border:1px solid var(--border2);border-radius:10px;padding:9px 18px;font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:13px;cursor:pointer;transition:all .18s;width:100%}
    .btn-ghost:hover{background:var(--border);color:var(--light)}.btn-ghost:active{transform:scale(.97)}
    .btn-danger{background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose-ring);border-radius:10px;padding:9px 18px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .18s}
    .btn-danger:hover{background:rgba(240,112,112,.25)}.btn-danger:active{transform:scale(.97)}.btn-danger:disabled{opacity:.4;cursor:not-allowed}
    .page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 90px}
    .mode-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:rgba(13,17,25,.9);backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:100px;padding:5px;z-index:200}
    .mode-pill{padding:8px 20px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .22s;background:transparent;color:var(--muted);font-family:'Noto Sans TC',sans-serif;white-space:nowrap}
    .mode-pill.active-guest{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-ring)}
    .mode-pill.active-staff{background:var(--lime-dim);color:var(--lime);border:1px solid var(--lime-ring)}
    .sub-tabs{display:flex;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:4px;gap:3px;overflow-x:auto}
    .sub-tab{flex:1;padding:8px 8px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;white-space:nowrap;min-width:56px}
    .sub-tab.t-scan{background:var(--lime-dim);color:var(--lime);border:1px solid var(--lime-ring)}
    .sub-tab.t-status{background:var(--sky-dim);color:var(--sky);border:1px solid var(--sky-ring)}
    .sub-tab.t-qr{background:var(--violet-dim);color:var(--violet);border:1px solid var(--violet-ring)}
    .sub-tab.t-import{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-ring)}
    .dash-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .stat-card{border-radius:14px;padding:16px 12px;text-align:center}
    .stat-card.total{background:rgba(96,168,240,.12);border:1px solid var(--sky-ring)}
    .stat-card.checked{background:rgba(125,219,140,.12);border:1px solid var(--lime-ring)}
    .stat-card.pending{background:rgba(240,112,112,.12);border:1px solid var(--rose-ring)}
    .stat-num{font-size:32px;font-weight:900;line-height:1}
    .stat-num.blue{color:var(--sky)}.stat-num.green{color:var(--lime)}.stat-num.red{color:var(--rose)}
    .stat-label{font-size:11px;color:var(--soft);margin-top:4px}
    .progress-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;height:28px}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--lime),#4ac96e);border-radius:10px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;min-width:40px}
    .progress-label{font-size:12px;font-weight:700;color:#061208}
    .guest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
    .g-card{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px}
    .g-card.done{background:rgba(125,219,140,.08);border:1px solid var(--lime-ring)}
    .g-card.todo{background:var(--card);border:1px solid var(--border2)}
    .g-badge{font-size:9px;font-weight:700;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:100px;display:inline-flex;align-items:center;gap:3px}
    .g-badge.done{background:rgba(125,219,140,.15);color:var(--lime);border:1px solid var(--lime-ring)}
    .g-badge.todo{background:var(--border);color:var(--muted);border:1px solid var(--border2)}
    .g-tag{font-size:9px;padding:1px 6px;border-radius:100px;background:var(--violet-dim);color:var(--violet);border:1px solid var(--violet-ring)}
    .filter-btn{padding:6px 14px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'Noto Sans TC',sans-serif;transition:all .18s;white-space:nowrap}
    .filter-btn.active{background:var(--sky-dim);color:var(--sky);border-color:var(--sky-ring)}
    .filter-btn.active-c{background:var(--lime-dim);color:var(--lime);border-color:var(--lime-ring)}
    .filter-btn.active-p{background:var(--rose-dim);color:var(--rose);border-color:var(--rose-ring)}
    .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
    .qr-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
    .qr-card.done{border-color:var(--lime-ring)}
    .qr-done-badge{position:absolute;top:7px;right:7px;background:var(--lime);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#061208}
    .qr-img-wrap{background:#fff;border-radius:8px;padding:5px;border:2px solid var(--gold);display:inline-flex}
    .qr-img-wrap.done-b{border-color:var(--lime)}
    .qr-btn{width:100%;padding:5px 0;border-radius:6px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:10px;cursor:pointer;border:none;transition:all .18s;text-align:center}
    .qr-btn.dl{background:var(--violet-dim);color:var(--violet);border:1px solid var(--violet-ring)}
    .qr-btn.cp{background:var(--sky-dim);color:var(--sky);border:1px solid var(--sky-ring)}
    .log-table{width:100%;border-collapse:collapse;font-size:12px}
    .log-table th{background:var(--card);color:var(--soft);font-weight:500;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border2);font-size:10px;white-space:nowrap}
    .log-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--light);vertical-align:middle}
    .log-table tr:last-child td{border-bottom:none}
    .log-table tr:hover td{background:rgba(46,61,85,.3)}
    .name-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border2);border-radius:12px;overflow:hidden;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .name-opt{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s;font-size:14px}
    .name-opt:hover{background:var(--card)}
    .name-opt:not(:last-child){border-bottom:1px solid var(--border)}
  </style>
</head>
<body>

<!-- ══════════ GUEST PAGE ══════════ -->
<div id="page-guest" class="page ambient-guest" style="display:none">
  <div class="w-full max-w-sm flex flex-col gap-6">
    <header class="text-center pt-2 space-y-3">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:100px;background:var(--gold-dim);border:1px solid var(--gold-ring)">
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.12em">貴賓查詢</span>
      </div>
      <h1 style="font-size:28px;font-weight:900;color:var(--white);line-height:1.2;letter-spacing:-.02em">查詢您的<br><span style="color:var(--gold)">入場 QR Code</span></h1>
      <p style="font-size:13px;color:var(--soft);line-height:1.7">輸入姓名即可取得您的專屬邀請碼</p>
    </header>
    <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold-ring),transparent)"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="position:relative" id="guest-wrap">
        <input type="text" id="guest-input" placeholder="輸入任一字即可搜尋，例：義" oninput="onGuestType()" onkeydown="onGuestKey(event)" autocomplete="off"/>
        <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none">🔍</span>
        <div id="name-dd" class="name-dropdown" style="display:none"></div>
      </div>
      <button class="btn-gold" id="guest-btn" onclick="searchByName()">查詢 QR Code</button>
    </div>
    <div id="guest-result" style="display:none"></div>
    <p style="text-align:center;font-size:11px;color:var(--muted)">若查無資料，請洽現場工作人員</p>
  </div>
</div>

<!-- ══════════ STAFF PAGE ══════════ -->
<div id="page-staff" class="page ambient-staff" style="display:none">
  <div class="w-full max-w-2xl flex flex-col gap-4">

    <!-- Gate -->
    <div id="staff-gate" style="min-height:70dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px">
      <div style="text-align:center">
        <div style="font-size:44px;margin-bottom:10px">🔐</div>
        <h2 style="font-size:22px;font-weight:900;color:var(--white)">工作人員入口</h2>
        <p style="font-size:13px;color:var(--soft);margin-top:6px">請輸入工作人員密碼</p>
      </div>
      <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px">
        <input type="password" id="staff-pw" class="lime-focus" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPW()"/>
        <button class="btn-lime" onclick="checkPW()" style="width:100%;padding:12px">進入工作人員系統</button>
        <p id="pw-err" style="display:none;text-align:center;font-size:12px;color:var(--rose)">密碼錯誤，請再試一次</p>
      </div>
    </div>

    <!-- Inner -->
    <div id="staff-inner" style="display:none;flex-direction:column;gap:14px">
      <!-- Dashboard -->
      <div class="dash-stats" id="dash-stats" style="display:none">
        <div class="stat-card total"><div class="stat-num blue" id="d-total">—</div><div class="stat-label">總人數</div></div>
        <div class="stat-card checked"><div class="stat-num green" id="d-checked">—</div><div class="stat-label">✓ 已報到</div></div>
        <div class="stat-card pending"><div class="stat-num red" id="d-pending">—</div><div class="stat-label">✗ 未報到</div></div>
      </div>
      <div id="dash-progress" style="display:none">
        <p style="font-size:11px;color:var(--muted);margin-bottom:6px">📊 報到進度</p>
        <div class="progress-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"><span class="progress-label" id="prog-label">0%</span></div></div>
      </div>

      <!-- Sub tabs -->
      <div class="sub-tabs">
        <button class="sub-tab" id="tab-scan"   onclick="switchTab('scan')">📷 掃碼報到</button>
        <button class="sub-tab" id="tab-status" onclick="switchTab('status')">📋 名單狀況</button>
        <button class="sub-tab" id="tab-qr"     onclick="switchTab('qr')">🔲 QR 碼管理</button>
        <button class="sub-tab" id="tab-import" onclick="switchTab('import')">📂 匯入管理</button>
      </div>

      <!-- ── 掃碼報到 ── -->
      <div id="panel-scan" style="display:none;flex-direction:column;gap:12px">
        <div style="border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--panel)">
          <div style="position:relative;width:100%;aspect-ratio:1;max-height:340px">
            <div id="qr-reader" style="position:absolute;inset:0"></div>
            <div class="vignette"></div>
            <div id="brackets" style="display:none">
              <div class="brk brk-tl"></div><div class="brk brk-tr"></div>
              <div class="brk brk-bl"></div><div class="brk brk-br"></div>
              <div class="laser"></div>
            </div>
            <div id="staff-idle" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card)">
              <div style="font-size:48px;opacity:.25">📷</div>
              <p style="font-size:13px;color:var(--muted)">相機尚未啟動</p>
            </div>
            <div id="staff-loading" style="display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;background:rgba(8,11,16,.82);backdrop-filter:blur(4px)">
              <div class="spinner"></div><p style="font-size:13px;color:var(--soft)">驗證報到資訊…</p>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <p id="s-title" style="font-size:13px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">尚未啟動</p>
              <p id="s-sub" style="font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">點擊右側按鈕開始掃描</p>
            </div>
            <button class="btn-lime" id="toggle-btn" onclick="staffToggle()">開始掃描</button>
          </div>
        </div>
        <div id="staff-result" style="display:none"></div>
        <div id="cam-err" style="display:none;border-radius:14px;border:1px solid var(--rose-ring);background:var(--rose-dim);padding:16px">
          <p style="font-weight:700;font-size:13px;color:var(--rose)">⚠ 無法存取相機</p>
          <p style="font-size:11px;color:var(--soft);margin-top:5px;line-height:1.6">請確認已授予相機權限後重新整理。</p>
          <button onclick="location.reload()" class="btn-ghost" style="margin-top:10px;width:auto;padding:7px 14px;font-size:11px">重新整理</button>
        </div>
      </div>

      <!-- ── 名單狀況 ── -->
      <div id="panel-status" style="display:none;flex-direction:column;gap:10px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <input type="text" id="status-search" placeholder="🔍 搜尋姓名或 ID…" oninput="renderStatusGrid()" style="font-size:13px"/>
          <!-- 下拉篩選 -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div style="display:flex;flex-direction:column;gap:4px">
              <label style="font-size:10px;color:var(--muted);font-weight:700">區別</label>
              <select id="filter-area" onchange="renderStatusGrid()">
                <option value="">全部區別</option>
              </select>
            </div>

// ══ Firestore API ══════════════════════
async function fsGet(col, id) {
  const r = await fetch(FS + '/' + col + '/' + encodeURIComponent(id) + '?key=' + FB_API_KEY);
  if (r.status === 404) return null;
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return parseDoc(d);
}

async function fsSet(col, id, fields) {
  const r = await fetch(FS + '/' + col + '/' + encodeURIComponent(id) + '?key=' + FB_API_KEY, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: toFsFields(fields) })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d;
}

async function fsDel(col, id) {
  const r = await fetch(FS + '/' + col + '/' + encodeURIComponent(id) + '?key=' + FB_API_KEY, { method: 'DELETE' });
  if (!r.ok && r.status !== 404) throw new Error('DELETE failed: ' + r.status);
}

async function fsList(col) {
  var docs = [], token = null;
  do {
    var url = FS + '/' + col + '?key=' + FB_API_KEY + '&pageSize=300' + (token ? '&pageToken=' + token : '');
    var r = await fetch(url);
    var d = await r.json();
    if (d.error) throw new Error(d.error.message);
    if (d.documents) docs = docs.concat(d.documents.map(parseDoc));
    token = d.nextPageToken || null;
  } while (token);
  return docs;
}

async function fsQueryByName(name) {
  var r = await fetch(FS + ':runQuery?key=' + FB_API_KEY, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'guests' }], where: { fieldFilter: { field: { fieldPath: 'name' }, op: 'EQUAL', value: { stringValue: name } } } } })
  });
  var res = await r.json();
  if (!Array.isArray(res)) return [];
  return res.filter(function(x) { return x.document; }).map(function(x) { return parseDoc(x.document); });
}

function parseDoc(doc) {
  var id = doc.name.split('/').pop();
  var f = {};
  var fields = doc.fields || {};
  Object.keys(fields).forEach(function(k) {
    var v = fields[k];
    f[k] = v.stringValue !== undefined ? v.stringValue :
           v.integerValue !== undefined ? v.integerValue :
           v.doubleValue !== undefined ? v.doubleValue :
           v.booleanValue !== undefined ? v.booleanValue : '';
  });
  f.id = id;
  return f;
}

function toFsFields(obj) {
  var f = {};
  Object.keys(obj).forEach(function(k) {
    var v = obj[k];
    if (typeof v === 'number') f[k] = Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    else if (typeof v === 'boolean') f[k] = { booleanValue: v };
    else if (v == null) f[k] = { nullValue: null };
    else f[k] = { stringValue: String(v) };
  });
  return f;
}

// ══ Routing ═══════════════════════════

// ══ Guest search ═══════════════════════
var guestCache = [];

async function preloadGuests() {
  if (guestCache.length) return;

function selectGuest(g) {

}

function onGuestKey(e) {

}

document.addEventListener('click', function(e) {

async function searchByName() {

  var btn = document.getElementById('guest-btn'); btn.disabled = true; btn.textContent = '查詢中…';
  document.getElementById('guest-result').style.display = 'none';
  try {
    var matches = guestCache.filter(function(g) { return g.name === name; });
    if (!matches.length) {
      var docs = await fsQueryByName(name);
      matches = docs;
    }
    if (!matches.length) guestErr('查無此姓名', '請確認姓名正確，或洽現場工作人員');
    else if (matches.length === 1) showQR(matches[0]);
    else showGuestPick(matches);
  } catch(e) { guestErr('連線失敗', '請確認網路後重試'); }
  btn.disabled = false; btn.textContent = '查詢 QR Code';
}

function guestErr(t, s) {

    '<div class="shimmer" style="display:inline-block;border-radius:14px;overflow:hidden;border:3px solid var(--gold);padding:7px;background:#fff">' +
    '<img src="' + qr + '" width="220" height="220" style="display:block;border-radius:7px" loading="lazy"/></div>' +
    '<div style="margin-top:14px;background:var(--card);border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)">' +
    '<span style="font-size:11px;color:var(--muted)">邀請 ID</span>' +

// ══ Data ═══════════════════════════════
var allGuests = [], checkedIds = new Set(), allLogs = [], dataLoaded = false;

async function loadAll() {
  showMsg('status-msg', 'sky', '載入中…', '直接從 Firestore 讀取');

  var aEl = document.getElementById('filter-area');

// ── Status grid ──
function renderStatusGrid() {
  var q      = (document.getElementById('status-search') ? document.getElementById('status-search').value : '').trim().toLowerCase();
  var areaF  = document.getElementById('filter-area')     ? document.getElementById('filter-area').value     : '';
  var referF = document.getElementById('filter-referrer') ? document.getElementById('filter-referrer').value : '';
  var filtered = allGuests.filter(function(g) {
    if (q && !(g.name || '').toLowerCase().includes(q) && !(g.id || '').toLowerCase().includes(q)) return false;
    if (statusFilter === 'checked' && !checkedIds.has(g.id)) return false;
    if (statusFilter === 'pending' &&  checkedIds.has(g.id)) return false;
    if (areaF  && g.area     !== areaF)  return false;
    if (referF && g.referrer !== referF) return false;
    return true;
  });
  var statsEl = document.getElementById('filter-stats');
  if (statsEl) {
    var hasFilter = q || areaF || referF || statusFilter !== 'all';
    if (hasFilter && filtered.length) {
      var chk = filtered.filter(function(g) { return checkedIds.has(g.id); }).length;
      statsEl.textContent = '篩選結果：' + filtered.length + ' 人（已報到 ' + chk + ' / 未報到 ' + (filtered.length - chk) + '）';
      statsEl.style.display = 'block';
    } else { statsEl.style.display = 'none'; }
  }
  var logMap = {};
  allLogs.forEach(function(l) { logMap[l.id] = l; });
  var grid = document.getElementById('status-grid');
  if (!filtered.length) { grid.innerHTML = '<p style="text-align:center;color:var(--muted);padding:30px;font-size:13px;grid-column:1/-1">查無符合條件的貴賓</p>'; return; }
  var html = '';
  filtered.forEach(function(g) {
    var done = checkedIds.has(g.id);
    var time = logMap[g.id] ? logMap[g.id].checkInTime || '' : '';
    var tags = '';
    if (g.area)     tags += '<span class="g-tag">' + g.area + '</span>';
    if (g.referrer) tags += '<span class="g-tag">介：' + g.referrer + '</span>';
    var tagsHtml = tags ? '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px">' + tags + '</div>' : '';
    var timeHtml = time ? '<div style="font-size:10px;color:var(--soft)">' + time + '</div>' : '';
    var action = done
      ? '<button class="btn-rose-xs" onclick="cancelCheckin(\'' + g.id + '\',\'' + g.name + '\')">↩ 取消</button>'
      : '<button class="btn-lime-xs" onclick="doCheckin(\'' + g.id + '\',\'' + g.name + '\')">報到</button>';
    html += '<div class="g-card ' + (done ? 'done' : 'todo') + '">' +
      '<div class="g-badge ' + (done ? 'done' : 'todo') + '">' + (done ? '☑ 已報到' : '☐ 未報到') + '</div>' +
      '<div style="font-size:13px;font-weight:700;color:var(--white)">' + g.name + '</div>' +
      '<div style="font-size:10px;color:var(--muted)">' + g.id + (g.temple ? '・' + g.temple : '') + '</div>' +
      tagsHtml + timeHtml +
      '<div style="display:flex;gap:4px;margin-top:2px">' + action + '</div></div>';
  });
  grid.innerHTML = html;
}

function setFilter(f) {
  statusFilter = f;
  document.getElementById('fb-all').className     = 'filter-btn' + (f === 'all'     ? ' active'   : '');
  document.getElementById('fb-checked').className = 'filter-btn' + (f === 'checked' ? ' active-c' : '');

}

      (done ? '<div class="qr-done-badge">✓</div>' : '') +
      '<div class="qr-img-wrap ' + (done ? 'done-b' : '') + '">' +
      '<img src="' + qr + '" width="90" height="90" loading="lazy" style="display:block;border-radius:5px"/></div>' +
      '<div style="font-size:12px;font-weight:700;color:var(--white);text-align:center;line-height:1.3">' + g.name + '</div>' +
      '<div style="font-size:9px;color:var(--muted)">' + g.id + (g.temple ? '・' + g.temple : '') + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:4px;width:100%">' +
      '<button class="qr-btn dl" onclick="dlQR(\'' + qr + '\',\'' + g.name + '\')">📥 下載 QR</button>' +
      '<button class="qr-btn cp" id="cpbtn_' + g.id + '" onclick="copyLink(\'' + url + '\',\'' + g.id + '\')">🔗 複製連結</button>' +
      '</div></div>';
  });
  grid.innerHTML = html;
}

function dlQR(src, name) {
  var a = document.createElement('a');
  a.href = src.replace('200x200', '400x400');
  a.download = 'QR_' + name + '.png'; a.target = '_blank'; a.click();
}

function copyLink(url, id) {
  var btn = document.getElementById('cpbtn_' + id);
  navigator.clipboard.writeText(url).then(function() {
    if (btn) { btn.textContent = '✓ 已複製！'; btn.style.background = 'var(--lime-dim)'; btn.style.color = 'var(--lime)'; }
    setTimeout(function() { if (btn) { btn.textContent = '🔗 複製連結'; btn.style.background = ''; btn.style.color = ''; } }, 2000);
  }).catch(function() { alert('請手動複製：' + url); });
}

function printAllQR() {
  if (!allGuests.length) { alert('請先載入名單'); return; }
  var win = window.open('', '_blank');
  var cards = allGuests.map(function(g) {
    var done = checkedIds.has(g.id);
    var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&ecc=M&data=' + encodeURIComponent(CHECKIN_BASE + '?id=' + g.id);
    return '<div style="display:inline-flex;flex-direction:column;align-items:center;gap:5px;padding:10px;border:1.5px solid ' + (done ? '#4ac96e' : '#ccc') + ';border-radius:10px;background:' + (done ? '#f0fff4' : '#fff') + ';page-break-inside:avoid;font-family:sans-serif">' +
      '<img src="' + qr + '" width="110" height="110" style="border-radius:5px"/>' +
      '<b style="font-size:12px;color:#000">' + g.name + '</b>' +
      '<span style="font-size:9px;color:#888">' + g.id + (g.temple ? '・' + g.temple : '') + '</span>' +
      (done ? '<span style="font-size:9px;color:#2a7a3a;font-weight:700">✓ 已報到</span>' : '') + '</div>';
  }).join('');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR Code 名單</title><style>body{padding:12px;background:#fff}#g{display:flex;flex-wrap:wrap;gap:6px}@media print{@page{margin:8mm}}</style></head><body><h2 style="margin-bottom:10px;font-family:sans-serif">貴賓 QR Code 名單</h2><div id="g">' + cards + '</div></body></html>');
  win.document.close(); setTimeout(function() { win.print(); }, 800);
}

function downloadAllQR() {
  alert('將逐一開啟各貴賓的 QR Code 下載連結。');
  allGuests.forEach(function(g, i) {
    setTimeout(function() {
      var a = document.createElement('a');
      a.href = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&ecc=M&data=' + encodeURIComponent(CHECKIN_BASE + '?id=' + g.id);
      a.download = 'QR_' + g.id + '_' + g.name + '.png'; a.target = '_blank'; a.click();
    }, i * 300);
  });
}

// ── Checkin / Cancel ──
async function doCheckin(id, name) {
  var existing = await fsGet('log', id);
  if (existing) { alert('⚠ ' + name + ' 已於 ' + existing.checkInTime + ' 完成報到'); return; }
  var t = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false }).replace(/\//g, '-');
  var guest = allGuests.find(function(g) { return g.id === id; }) || {};
  await fsSet('log', id, { id: id, name: name, temple: guest.temple || '', checkInTime: t, status: '已報到' });
  checkedIds.add(id);
  allLogs.push({ id: id, name: name, temple: guest.temple || '', checkInTime: t });
  updateDash(); renderStatusGrid(); renderQRGrid(); renderLogTable(allLogs);
  alert('✓ ' + name + ' 報到成功！\n時間：' + t);
}

async function cancelCheckin(id, name) {
  if (!confirm('確定取消「' + name + '」的報到記錄？')) return;
  await fsDel('log', id);
  checkedIds.delete(id);
  allLogs = allLogs.filter(function(l) { return l.id !== id; });
  updateDash(); renderStatusGrid(); renderQRGrid(); renderLogTable(allLogs);
  alert('已取消 ' + name + ' 的報到記錄');
}

// ── Scanner ──
var qrScanner = null, scanning = false, busy = false;
function staffToggle() { if (scanning) stopScanner(); else startScanner(); }
function startScanner() {
  qrScanner = new Html5Qrcode('qr-reader');
  qrScanner.start({ facingMode: 'environment' },
    { fps: 15, qrbox: { width: 200, height: 200 }, aspectRatio: 1.0, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] },
    onScan, function() {})
  .then(function() {
    scanning = true;
    document.getElementById('staff-idle').style.display = 'none';
    document.getElementById('brackets').style.display = 'block';
    document.getElementById('toggle-btn').textContent = '停止掃描';
    setSt('掃描中…', '請將貴賓 QR Code 對準掃描框');
  }).catch(function() {
    document.getElementById('cam-err').style.display = 'block';
    document.getElementById('toggle-btn').disabled = true;
    setSt('相機錯誤', '請檢查相機權限');
  });
}
async function stopScanner() {
  if (!qrScanner || !scanning) return;
  try { await qrScanner.stop(); } catch(e) {}
  scanning = false;
  document.getElementById('brackets').style.display = 'none';
  document.getElementById('staff-idle').style.display = 'flex';
  document.getElementById('toggle-btn').textContent = '開始掃描';
  setSt('已停止', '點擊按鈕重新掃描');
}
async function onScan(decoded) {
  if (busy) return; busy = true;
  await stopScanner();
  var id = null;
  try { id = new URL(decoded).searchParams.get('id'); } catch(e) { id = decoded.trim() || null; }
  if (!id) { scanResult('error', 'QR Code 無效', '找不到報到 ID', null); busy = false; return; }
  document.getElementById('staff-loading').style.display = 'flex';
  setSt('驗證中…', 'ID：' + id);
  document.getElementById('toggle-btn').disabled = true;
  try {
    var guest = allGuests.find(function(g) { return g.id === id; }) || await fsGet('guests', id);
    if (!guest) {
      scanResult('error', '非受邀貴賓', '此 QR Code 不在貴賓名單中', null);
    } else {
      var logDoc = await fsGet('log', id);
      if (logDoc) {
        scanResult('warn', '您已完成報到，請勿重複掃描', '首次報到：' + logDoc.checkInTime, { id: id, name: guest.name });
      } else {
        var t = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false }).replace(/\//g, '-');
        await fsSet('log', id, { id: id, name: guest.name, temple: guest.temple || '', checkInTime: t, status: '已報到' });
        checkedIds.add(id);
        allLogs.push({ id: id, name: guest.name, temple: guest.temple || '', checkInTime: t });
        updateDash(); renderStatusGrid(); renderQRGrid(); renderLogTable(allLogs);
        scanResult('success', '歡迎光臨，' + guest.name + ' 先生/小姐', '報到時間：' + t, { id: id, name: guest.name });
      }
    }
  } catch(e) { scanResult('error', '連線失敗', e.message || '請確認網路後重試', null); }
  document.getElementById('staff-loading').style.display = 'none';
  document.getElementById('toggle-btn').disabled = false;
  document.getElementById('toggle-btn').textContent = '開始掃描';
  busy = false;
}

var RS = {
  success: { icon: '✓', bg: 'var(--lime-dim)', br: 'var(--lime-ring)', ic: 'var(--lime)', tc: 'var(--lime)' },
  warn:    { icon: '!', bg: 'var(--amber-dim)', br: 'var(--amber-ring)', ic: 'var(--amber)', tc: 'var(--amber)' },
  error:   { icon: '✕', bg: 'var(--rose-dim)', br: 'var(--rose-ring)', ic: 'var(--rose)', tc: 'var(--rose)' }
};
function scanResult(type, title, sub, data) {
  var s = RS[type];
  var rows = data ? '<div style="background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-top:10px">' +
    (data.name ? '<div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:var(--muted)">姓名</span><span style="font-size:13px;font-weight:700;color:var(--white)">' + data.name + '</span></div>' : '') +
    '<div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:var(--muted)">ID</span><span style="font-size:12px;color:var(--light)">' + (data.id || '—') + '</span></div></div>' : '';
  var el = document.getElementById('staff-result');
  el.innerHTML = '<div style="border-radius:18px;border:1px solid ' + s.br + ';background:' + s.bg + ';padding:20px">' +
    '<div style="text-align:center">' +
    '<div style="width:48px;height:48px;border-radius:50%;background:' + s.bg + ';border:1px solid ' + s.br + ';display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:' + s.ic + ';margin:0 auto 10px">' + s.icon + '</div>' +
    '<p style="font-weight:900;font-size:16px;color:' + s.tc + '">' + title + '</p>' +
    '<p style="font-size:11px;color:var(--soft);margin-top:4px">' + sub + '</p></div>' + rows + '</div>' +
    '<button class="btn-ghost" onclick="resetScan()" style="margin-top:7px">繼續掃下一位 →</button>';
  el.style.display = 'block'; void el.offsetWidth; el.classList.add('rise');
  setSt('掃描完成', '查看下方結果');
}
function resetScan() { document.getElementById('staff-result').style.display = 'none'; startScanner(); }
function setSt(t, s) { document.getElementById('s-title').textContent = t; document.getElementById('s-sub').textContent = s; }

// ── Log table ──
function renderLogTable(logs) {
  var html = '';
  var rev = logs.slice().reverse();
  rev.forEach(function(l) {
    html += '<tr>' +
      '<td style="font-size:10px;color:var(--muted)">' + l.id + '</td>' +
      '<td style="font-weight:700;font-size:12px">' + (l.name || '—') + '</td>' +
      '<td style="font-size:11px;color:var(--soft)">' + (l.checkInTime || '—') + '</td>' +
      '<td><button class="btn-rose-xs" onclick="cancelCheckin(\'' + l.id + '\',\'' + (l.name || l.id) + '\')">取消</button></td></tr>';
  });
  document.getElementById('log-tbody').innerHTML = html || '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:18px">尚無報到記錄</td></tr>';
}
function filterLogTable() {
  var q = document.getElementById('log-search').value.trim().toLowerCase();
  renderLogTable(q ? allLogs.filter(function(l) { return (l.name || '').toLowerCase().includes(q) || (l.id || '').toLowerCase().includes(q); }) : allLogs);
}

// ── Import ──
var importData = [];
function previewImport() {
  var file = document.getElementById('import-file').files[0]; if (!file) { alert('請先選擇 CSV 檔案'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var lines = e.target.result.replace(/\r/g, '').split('\n').filter(function(l) { return l.trim(); });
    if (lines.length < 2) { showImportMsg('檔案至少需要表頭和一筆資料'); return; }
    var header = lines[0].split(',').map(function(h) { return h.replace(/"/g, '').trim().toLowerCase(); });
    var idIdx   = header.findIndex(function(h) { return h === 'id' || h === 'ID' || h === '編號'; });
    var nameIdx = header.findIndex(function(h) { return h === 'name' || h === '姓名'; });
    if (idIdx < 0 || nameIdx < 0) { showImportMsg('CSV 缺少必要欄位：id/ID 和 name/姓名'); return; }
    var tIdx = header.findIndex(function(h) { return h === 'temple' || h === '所屬佛堂'; });
    var nIdx = header.findIndex(function(h) { return h === 'note'   || h === '備註'; });
    var aIdx = header.findIndex(function(h) { return h === 'area'   || h === '區別'; });
    var rIdx = header.findIndex(function(h) { return h === 'referrer' || h === '介紹人'; });
    importData = lines.slice(1).map(function(line) {
      var cols = line.match(/("(?:[^"]|"")*"|[^,]*)/g).map(function(c) { return c.replace(/^"|"$/g, '').replace(/""/g, '"').trim(); });
      return {
        id:       cols[idIdx]   || '',
        name:     cols[nameIdx] || '',
        temple:   tIdx >= 0 ? (cols[tIdx]   || '') : '',
        note:     nIdx >= 0 ? (cols[nIdx]   || '') : '',
        area:     aIdx >= 0 ? (cols[aIdx]   || '') : '',
        referrer: rIdx >= 0 ? (cols[rIdx]   || '') : ''
      };
    }).filter(function(r) { return r.id && r.name; });
    var prev = document.getElementById('import-preview');
    var previewRows = importData.slice(0, 8).map(function(r) {
      return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px"><span>' + r.name + (r.area ? ' [' + r.area + ']' : '') + '</span><span style="color:var(--muted)">' + r.id + '</span></div>';
    }).join('');
    prev.innerHTML = '<div style="background:var(--panel);border:1px solid var(--sky-ring);border-radius:10px;padding:12px">' +
      '<p style="font-size:12px;font-weight:700;color:var(--sky);margin-bottom:8px">預覽：共 ' + importData.length + ' 筆</p>' +
      '<div style="max-height:150px;overflow-y:auto">' + previewRows + (importData.length > 8 ? '<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:5px">…還有 ' + (importData.length - 8) + ' 筆</p>' : '') + '</div></div>';
    prev.style.display = 'block';
    document.getElementById('import-btn').style.display = 'block';
  };
  reader.readAsText(file, 'UTF-8');
}

async function confirmImport() {
  if (!importData.length) { alert('沒有可匯入的資料'); return; }
  if (!confirm('確定匯入 ' + importData.length + ' 筆？相同 ID 將被覆蓋')) return;
  var btn = document.getElementById('import-btn'); btn.disabled = true; btn.textContent = '匯入中…';
  try {
    await Promise.all(importData.map(function(g) { return fsSet('guests', g.id, g); }));
    showMsg('import-msg', 'lime', '匯入完成', '成功寫入 ' + importData.length + ' 筆資料');
    importData = [];
    document.getElementById('import-preview').style.display = 'none';
    document.getElementById('import-file').value = '';
    btn.style.display = 'none';
    setTimeout(function() { loadAll(); }, 800);
  } catch(e) { showMsg('import-msg', 'rose', '匯入失敗', e.message); }
  btn.disabled = false; btn.textContent = '確認匯入';
}

function showImportMsg(msg) {
  var p = document.getElementById('import-preview');
  p.innerHTML = '<div style="background:var(--rose-dim);border:1px solid var(--rose-ring);border-radius:8px;padding:10px;font-size:12px;color:var(--rose)">' + msg + '</div>';
  p.style.display = 'block';
}

function exportGuestCSV() {
  if (!allGuests.length) { alert('請先載入名單'); return; }
  var rows = allGuests.map(function(g) {
    return [g.id, g.name, g.temple || '', g.note || '', g.area || '', g.referrer || '', checkedIds.has(g.id) ? '已報到' : '未報到']
      .map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  });
  dlCSV('\uFEFF' + 'ID,姓名,所屬佛堂,備註,區別,介紹人,狀態\n' + rows.join('\n'), '貴賓名單_' + today() + '.csv');
}

function exportLogCSV() {
  if (!allLogs.length) { alert('尚無報到記錄'); return; }
  var rows = allLogs.map(function(l) {
    return [l.id, l.name || '', l.temple || '', l.checkInTime || '']
      .map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  });
  dlCSV('\uFEFF' + 'ID,姓名,佛堂,報到時間\n' + rows.join('\n'), '報到記錄_' + today() + '.csv');
}

// ── Utils ──
function animShow(el) { el.style.display = 'block'; el.classList.remove('rise'); void el.offsetWidth; el.classList.add('rise'); }
function dlCSV(c, f) { var a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(c); a.download = f; a.click(); }
function today() { return new Date().toLocaleDateString('zh-TW'); }
function showMsg(elId, color, title, sub) {
  var cm = { sky: 'var(--sky)', lime: 'var(--lime)', rose: 'var(--rose)', violet: 'var(--violet)', amber: 'var(--amber)' };
  var bm = { sky: 'var(--sky-dim)', lime: 'var(--lime-dim)', rose: 'var(--rose-dim)', violet: 'var(--violet-dim)', amber: 'var(--amber-dim)' };
  var rm = { sky: 'var(--sky-ring)', lime: 'var(--lime-ring)', rose: 'var(--rose-ring)', violet: 'var(--violet-ring)', amber: 'var(--amber-ring)' };
  var el = document.getElementById(elId); if (!el) return;
  el.innerHTML = '<div style="border-radius:12px;border:1px solid ' + (rm[color] || 'var(--border)') + ';background:' + (bm[color] || 'var(--card)') + ';padding:14px;text-align:center"><p style="font-weight:700;font-size:13px;color:' + (cm[color] || 'var(--light)') + '">' + title + '</p><p style="font-size:11px;color:var(--soft);margin-top:3px">' + sub + '</p></div>';
  el.style.display = 'block';
}
</script>
